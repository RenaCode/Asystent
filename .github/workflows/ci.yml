name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-core:
    name: Agent core (swift test)
    # GitHub-hosted runners only: this repository is public, so a self-hosted runner
    # would execute code from pull requests opened by forks.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift test
        run: swift test

  ios-build:
    name: iOS app (simulator build, App Store and local variants)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install XcodeGen
        run: brew install xcodegen
      - name: build App Store variant (project.yml)
        run: |
          xcodegen generate
          xcodebuild build-for-testing \
            -project Asystent.xcodeproj -scheme Asystent \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/store CODE_SIGNING_ALLOWED=NO
      - name: build local variant with HomeKit (project-local.yml)
        run: |
          xcodegen generate --spec project-local.yml
          xcodebuild build-for-testing \
            -project Asystent.xcodeproj -scheme Asystent \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/local CODE_SIGNING_ALLOWED=NO
      # PLA §3.3.3(I): HomeKit must not reach the App Store build. The local build is the positive
      # control, so an always-silent check cannot pass unnoticed.
      - name: App Store variant has no HomeKit
        run: |
          has_homekit() {
            app=build/$1/Build/Products/Debug-iphonesimulator/Asystent.app
            test -d "$app" || { echo "missing $app"; exit 1; }
            /usr/libexec/PlistBuddy -c 'Print :NSHomeKitUsageDescription' "$app/Info.plist" >/dev/null 2>&1 \
              || grep -rqa --exclude-dir='*.xctest' -e home_control -e /HomeKit.framework/ "$app"
          }
          has_homekit local || { echo "positive control failed: local build has no HomeKit"; exit 1; }
          if has_homekit store; then echo "App Store build contains HomeKit"; exit 1; fi
          if xcodegen dump --type yaml | grep -qi homekit; then
            echo "App Store spec declares entitlements"; exit 1
          fi

  proxy:
    name: Proxy (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
