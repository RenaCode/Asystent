name: Asystent
options:
  bundleIdPrefix: com.renacode
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
# Build sklepowy (Hejo): BYO key, bez HomeKit. Build osobisty z HomeKit: project-local.yml.
# Bundle ID, Team i adres proxy — w Config/Config.local.xcconfig (poza repo).
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
targets:
  Asystent:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASYSTENT_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Hejo
        # Mówiona pisownia nazwy dla Siri po angielsku (2.5.11: nie słowo ogólne).
        INAlternativeAppNames:
          - INAlternativeAppName: Heyo
        PROXY_URL: $(PROXY_URL)
        APP_TOKEN: $(APP_TOKEN)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Hejo listens only while the microphone button is active, to turn your command into text.
        NSSpeechRecognitionUsageDescription: Your speech is transcribed on this iPhone when possible, otherwise by Apple's servers. The text (not the audio) is sent to Claude by Anthropic to answer you.
        NSCalendarsFullAccessUsageDescription: Hejo adds events you ask for and reads event dates and titles to answer questions; those titles are sent to Claude (Anthropic).
        NSRemindersFullAccessUsageDescription: Hejo creates reminders you dictate; the reminder text is sent to Claude (Anthropic).
        LSApplicationQueriesSchemes: [shortcuts]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [asystent]
    # Build sklepowy: bez HomeKit i bez wyjątku ATS dla sieci lokalnej — oba dokłada project-local.yml.
    dependencies:
      - target: AsystentControls
    scheme:
      testTargets:
        - AsystentTests
      commandLineArguments:
        "-mute": true
  AsystentControls:
    type: app-extension
    platform: iOS
    sources:
      - Controls
      - path: Sources/Intents/StartListeningIntent.swift
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASYSTENT_BUNDLE_ID).controls
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Controls-Info.plist
      properties:
        CFBundleDisplayName: Hejo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AsystentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AsystentTests
    dependencies:
      - target: Asystent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ASYSTENT_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
